{% extends 'base.html' %}
{% block title %}Login - ChatBox{% endblock %}
{% block body %}
<div class="auth-screen auth-screen-alt">
  <div class="auth-glow auth-glow-a"></div>
  <div class="auth-glow auth-glow-b"></div>
  <div class="auth-card" data-aos="fade-up">
    <div class="d-flex justify-content-end">
      <button class="icon-btn theme-toggle" id="themeToggle" type="button" title="Toggle theme">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>
    <div class="brand-mark">ChatBox</div>
    <h1>Welcome back</h1>
    <p>Continue your conversations with your AI assistant.</p>
    <form method="post" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Email</label>
      <input type="email" name="email" class="form-control form-control-lg" required autocomplete="email">
      <label>Password</label>
      <input type="password" name="password" class="form-control form-control-lg" required autocomplete="current-password">
      <button class="btn btn-accent w-100 mt-3" type="submit">Login</button>
    </form>
    <div class="auth-footer">New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></div>
  </div>
</div>
{% endblock %}
