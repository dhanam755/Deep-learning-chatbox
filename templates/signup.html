{% extends 'base.html' %}
{% block title %}Sign Up - ChatBox{% endblock %}
{% block body %}
<div class="auth-screen">
  <div class="auth-glow auth-glow-a"></div>
  <div class="auth-glow auth-glow-b"></div>
  <div class="auth-card" data-aos="fade-up">
    <div class="d-flex justify-content-end">
      <button class="icon-btn theme-toggle" id="themeToggle" type="button" title="Toggle theme">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>
    <div class="brand-mark">ChatBox</div>
    <h1>Create your account</h1>
    <p>Secure access to your personal AI workspace.</p>
    <form method="post" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Name</label>
      <input type="text" name="name" class="form-control form-control-lg" required autocomplete="name">
      <label>Email</label>
      <input type="email" name="email" class="form-control form-control-lg" required autocomplete="email">
      <label>Password</label>
      <input type="password" name="password" class="form-control form-control-lg" required autocomplete="new-password">
      <label>Confirm Password</label>
      <input type="password" name="confirm_password" class="form-control form-control-lg" required autocomplete="new-password">
      <button class="btn btn-accent w-100 mt-3" type="submit">Create account</button>
    </form>
    <div class="auth-footer">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></div>
  </div>
</div>
{% endblock %}
